<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" fill="none" role="img" aria-label="Notification reports illustration">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EAF4FB"/>
      <stop offset="55%" stop-color="#F6F8FB"/>
      <stop offset="100%" stop-color="#EDF8F0"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FBFE"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#2879B6" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="960" height="640" fill="url(#sky)"/>
  <circle cx="760" cy="120" r="90" fill="#BFDDF0" opacity="0.45"/>
  <circle cx="140" cy="480" r="120" fill="#CDE8C8" opacity="0.35"/>

  <!-- Envelope / report card -->
  <g filter="url(#soft)">
    <rect x="210" y="150" width="420" height="300" rx="22" fill="url(#card)" stroke="#E5E7EB"/>
    <rect x="210" y="150" width="420" height="56" rx="22" fill="#2879B6"/>
    <rect x="210" y="184" width="420" height="22" fill="#2879B6"/>
    <circle cx="248" cy="178" r="8" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="274" cy="178" r="8" fill="#FFFFFF" opacity="0.55"/>
    <circle cx="300" cy="178" r="8" fill="#FFFFFF" opacity="0.35"/>
    <text x="420" y="184" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">User Engagement Report</text>

    <rect x="248" y="236" width="120" height="64" rx="12" fill="#EAF4FB" stroke="#BFDDF0"/>
    <text x="308" y="264" text-anchor="middle" fill="#2879B6" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">262</text>
    <text x="308" y="284" text-anchor="middle" fill="#64748B" font-family="Segoe UI, Arial, sans-serif" font-size="11">Users</text>

    <rect x="386" y="236" width="120" height="64" rx="12" fill="#EDF8F0" stroke="#C6E6CE"/>
    <text x="446" y="264" text-anchor="middle" fill="#34A853" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">56%</text>
    <text x="446" y="284" text-anchor="middle" fill="#64748B" font-family="Segoe UI, Arial, sans-serif" font-size="11">Signed in</text>

    <rect x="524" y="236" width="80" height="64" rx="12" fill="#FFF7E6" stroke="#F3E0B5"/>
    <text x="564" y="264" text-anchor="middle" fill="#D97706" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">4</text>
    <text x="564" y="284" text-anchor="middle" fill="#64748B" font-family="Segoe UI, Arial, sans-serif" font-size="11">Open</text>

    <rect x="248" y="320" width="344" height="10" rx="5" fill="#EEF2F7"/>
    <rect x="248" y="320" width="210" height="10" rx="5" fill="#2879B6" opacity="0.85"/>
    <rect x="248" y="344" width="344" height="10" rx="5" fill="#EEF2F7"/>
    <rect x="248" y="344" width="150" height="10" rx="5" fill="#4A9AD0" opacity="0.7"/>
    <rect x="248" y="368" width="344" height="10" rx="5" fill="#EEF2F7"/>
    <rect x="248" y="368" width="280" height="10" rx="5" fill="#34A853" opacity="0.65"/>
  </g>

  <!-- Schedule chip -->
  <g filter="url(#soft)">
    <rect x="620" y="210" width="200" height="88" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
    <rect x="640" y="232" width="36" height="36" rx="10" fill="#EAF4FB"/>
    <path d="M652 244h12M658 238v12M648 258h20" stroke="#2879B6" stroke-width="2" stroke-linecap="round"/>
    <text x="690" y="248" fill="#1E293B" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Daily 09:00</text>
    <text x="690" y="268" fill="#64748B" font-family="Segoe UI, Arial, sans-serif" font-size="11">Auto-send to managers</text>
  </g>

  <!-- Delivery chip -->
  <g filter="url(#soft)">
    <rect x="640" y="330" width="180" height="72" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
    <circle cx="676" cy="366" r="16" fill="#EDF8F0"/>
    <path d="M669 366l5 5 10-12" stroke="#34A853" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="702" y="362" fill="#1E293B" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Delivered</text>
    <text x="702" y="380" fill="#64748B" font-family="Segoe UI, Arial, sans-serif" font-size="11">128 closed tickets</text>
  </g>
</svg>
