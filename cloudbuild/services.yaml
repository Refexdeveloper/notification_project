steps:
  - id: build-backend-api
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - asia-south1-docker.pkg.dev/${PROJECT_ID}/refex-engagement-report/backend-api:${COMMIT_SHA}
      - -f
      - services/backend-api/Dockerfile
      - .

  - id: build-admin-ui
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --no-cache
      - -t
      - asia-south1-docker.pkg.dev/${PROJECT_ID}/refex-engagement-report/admin-ui:${COMMIT_SHA}
      - --build-arg
      - VITE_API_BASE_URL=${_API_BASE_URL}
      - --build-arg
      - VITE_USE_BACKEND_API=${_VITE_USE_BACKEND_API}
      - --build-arg
      - CACHEBUST=${COMMIT_SHA}
      - -f
      - apps/admin-ui/Dockerfile
      - apps/admin-ui

  - id: build-engagement-pipeline
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - asia-south1-docker.pkg.dev/${PROJECT_ID}/refex-engagement-report/engagement-pipeline:${COMMIT_SHA}
      - -f
      - services/engagement-pipeline/Dockerfile
      - services/engagement-pipeline

images:
  - asia-south1-docker.pkg.dev/${PROJECT_ID}/refex-engagement-report/backend-api:${COMMIT_SHA}
  - asia-south1-docker.pkg.dev/${PROJECT_ID}/refex-engagement-report/admin-ui:${COMMIT_SHA}
  - asia-south1-docker.pkg.dev/${PROJECT_ID}/refex-engagement-report/engagement-pipeline:${COMMIT_SHA}

substitutions:
  _API_BASE_URL: https://backend-api-placeholder.run.app/api/v1
  _VITE_USE_BACKEND_API: "true"

options:
  logging: CLOUD_LOGGING_ONLY
